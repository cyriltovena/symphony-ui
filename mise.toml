[tools]
node = "22.22.0"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Run the Vite development server"
run = "npm run dev"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.test]
description = "Run the Vitest suite"
run = "npm run test"

[tasks.build]
description = "Create a production build"
run = "npm run build"

[tasks.check]
description = "Run lint, test, and build"
depends = ["lint", "test", "build"]
